name: Gemini görsel testi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Modelleri dene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.error
          anahtar = os.environ.get("GEMINI_API_KEY", "").strip()
          if not anahtar:
              raise SystemExit("GEMINI_API_KEY yok")
          istem = ("Vertical 9:16 cinematic still, teal and amber color grade, dark moody: "
                   "human lungs made of glowing alveoli, 3D medical render, no text")
          modeller = ["gemini-2.5-flash-image", "gemini-2.5-flash-image-preview",
                      "gemini-3-pro-image-preview", "gemini-3.1-flash-image", "gemini-2.0-flash-preview-image-generation"]
          for m in modeller:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={anahtar}"
              govde = {"contents": [{"parts": [{"text": istem}]}],
                       "generationConfig": {"responseModalities": ["IMAGE"]}}
              r = urllib.request.Request(url, data=json.dumps(govde).encode(), method="POST",
                                         headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=120) as y:
                      d = json.loads(y.read().decode())
                  parts = d["candidates"][0]["content"]["parts"]
                  img = [p for p in parts if "inlineData" in p or "inline_data" in p]
                  if img:
                      veri = img[0].get("inlineData") or img[0].get("inline_data")
                      boyut = len(base64.b64decode(veri["data"]))
                      print(f"OK {m} -> {boyut} bayt, mime={veri.get('mimeType') or veri.get('mime_type')}")
                      open("kontrol.png","wb").write(base64.b64decode(veri["data"]))
                      break
                  print(f"GORSEL_YOK {m}: {str(parts)[:160]}")
              except urllib.error.HTTPError as h:
                  print(f"HATA {m}: {h.code} {h.read().decode()[:160]}")
              except Exception as h:
                  print(f"HATA {m}: {type(h).__name__} {str(h)[:120]}")
          PY
