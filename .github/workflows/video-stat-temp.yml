name: Video stat temp

on:
  workflow_dispatch:
    inputs:
      vid:
        required: false
        default: 'LHL6c2pB-2g'

permissions:
  contents: read

jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Stat
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          VID: ${{ inputs.vid }}
        run: |
          python - <<'PYEOF'
          import os,json,pathlib
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          pathlib.Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"],encoding="utf8")
          creds=Credentials.from_authorized_user_file("token.json")
          if not creds.valid: creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds)
          vid=os.environ.get("VID","LHL6c2pB-2g")
          r=yt.videos().list(part="snippet,status,statistics,processingDetails,contentDetails",id=vid).execute()
          items=r.get("items",[])
          print("COUNT",len(items))
          for it in items:
              s=it.get("status",{}); st=it.get("statistics",{}); sn=it.get("snippet",{}); p=it.get("processingDetails",{})
              print(json.dumps({
                "id":it["id"],"title":sn.get("title"),"publishedAt":sn.get("publishedAt"),
                "privacyStatus":s.get("privacyStatus"),"uploadStatus":s.get("uploadStatus"),
                "failureReason":s.get("failureReason"),"rejectionReason":s.get("rejectionReason"),
                "publishAt":s.get("publishAt"),"license":s.get("license"),"madeForKids":s.get("madeForKids"),
                "selfDeclaredMadeForKids":s.get("selfDeclaredMadeForKids"),
                "views":st.get("viewCount"),"likes":st.get("likeCount"),"comments":st.get("commentCount"),
                "processingStatus":p.get("processingStatus"),"duration":it.get("contentDetails",{}).get("duration")
              }, ensure_ascii=False))
          PYEOF
