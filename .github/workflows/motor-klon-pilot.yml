name: Motor · 095 Ses Klon Pilotu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  klon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COQUI_TOS_AGREED: '1'
      REF_FILE_ID: 1c1lstH03Kkf4pzvHVu5vavDJ_xDigxNQ
      DRIVE_PARENT_ID: 1lKrhKOx9ywnhhA9xRkBGlhjxY8Ee9fg1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q coqui-tts google-api-python-client google-auth google-auth-httplib2
      - name: Referans sesi Drive'dan indir
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials.from_authorized_user_file('token.json')
          if not c.valid: c.refresh(Request())
          d=build('drive','v3',credentials=c,cache_discovery=False)
          with open('ref_095.wav','wb') as f:
              dl=MediaIoBaseDownload(f,d.files().get_media(fileId=os.environ['REF_FILE_ID'])); done=False
              while not done: _,done=dl.next_chunk()
          PY
      - name: XTTS-v2 Türkçe klon pilotu
        run: |
          tts --text "Bazı gerçekler, ilk duyduğunda inanılmaz gelir. Peki beynimiz yeni bir bilgiyle karşılaşınca neden kısa bir an duraksar? Çünkü o anda, bildiklerimizle duyduklarımızı karşılaştırır; sonra en güçlü ihtimali seçer. İşte merak, tam burada başlar." --model_name tts_models/multilingual/multi-dataset/xtts_v2 --speaker_wav ref_095.wav --language_idx tr --out_path klon_ham.wav
          ffmpeg -y -i klon_ham.wav -af 'highpass=f=70,equalizer=f=250:t=q:width=1.1:g=-1.0,equalizer=f=3500:t=q:width=1.0:g=0.8,atempo=0.95,loudnorm=I=-18:TP=-1.5:LRA=11' -ar 48000 -ac 1 -c:a pcm_s16le klon_095_xtts.wav
      - name: Drive'a yükle
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          c=Credentials.from_authorized_user_file('token.json')
          if not c.valid: c.refresh(Request())
          d=build('drive','v3',credentials=c,cache_discovery=False)
          name='KLON_PILOT_XTTS_095_'+datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S')
          folder=d.files().create(body={'name':name,'mimeType':'application/vnd.google-apps.folder','parents':[os.environ['DRIVE_PARENT_ID']]},fields='id,name,webViewLink').execute()
          r=d.files().create(body={'name':'klon_095_xtts.wav','parents':[folder['id']]},media_body=MediaFileUpload('klon_095_xtts.wav',mimetype='audio/wav'),fields='id,name,webViewLink,size').execute()
          print('FILE',r); print('FOLDER',folder)
          PY
