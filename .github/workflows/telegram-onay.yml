name: Telegram onay buton işçisi
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: telegram-onay-isci
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  onay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 openpyxl
      - name: Telegram butonlarını işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_ONAY || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_FOLDER: 1GK-yImpb09445uXfTUbIl7l6AfNM4BOb
          APPROVAL_FOLDER: 1xyO_jNjbpghfR7CJ1P9DUvkzdb6eC0qf
          WORKBOOK_ID: 1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo
        run: python telegram_onay_worker.py
      # Tamirci botunun "Durum" / "Bu hataya bak" düğmeleri. Ayrı bot, ayrı token.
      # Hata verse bile onay işini düşürmez (continue-on-error).
      - name: Tamirci düğmelerini işle
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_TAMIRCI }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tamirci_buton_worker.py
