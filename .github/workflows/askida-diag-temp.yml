name: Askida diag (gecici)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib openpyxl
      - name: D
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TABLE_ID: "1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo"
        run: |
          python - <<'PYEOF'
          import os, io, json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import openpyxl
          open("token.json","w",encoding="utf8").write(os.environ["GOOGLE_TOKEN_JSON"])
          creds=Credentials.from_authorized_user_file("token.json")
          if not creds.valid: creds.refresh(Request())
          drive=build("drive","v3",credentials=creds)
          tid=os.environ["TABLE_ID"]
          meta=drive.files().get(fileId=tid, fields="id,name,modifiedTime,size").execute()
          print("META", json.dumps(meta, ensure_ascii=False))
          buf=io.BytesIO(); dl=MediaIoBaseDownload(buf, drive.files().get_media(fileId=tid))
          done=False
          while not done: _,done=dl.next_chunk()
          buf.seek(0); wb=openpyxl.load_workbook(buf)
          print("SHEETS", wb.sheetnames)
          ws=wb["DRIVE"] if "DRIVE" in wb.sheetnames else wb.active
          for r in range(2, ws.max_row+1):
              st=str(ws.cell(r,1).value or "").strip()
              fn=str(ws.cell(r,2).value or "").strip()
              if "ASKIDA" in st.upper() or "194" in fn or "195" in fn or "196" in fn:
                  print("ROW",r,st,"|",fn)
          PYEOF
