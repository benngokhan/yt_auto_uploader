name: Analizden Short üret (Telegram onaylı)

# Kullanıcı tarafından elle tetiklenir. YouTube Analytics verisiyle en ilgi
# çeken UZUN videoyu bulur, 7 sahneli Short üretir, video+kapağı Telegram'a
# gönderir. 'onayladım' yazılınca Drive video_<N> + baslik.xlsx satırı yazılır.
# 19:30 yayın saatine ve crosspost bayraklarına DOKUNMAZ.

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "Üretilecek Short sayısı (önerilen: 2)"
        required: false
        default: "2"
        type: string
      gun:
        description: "Analiz penceresi (gün)"
        required: false
        default: "30"
        type: string
      onay_dakika:
        description: "Her video için Telegram onay süresi (dakika)"
        required: false
        default: "30"
        type: string
      kuru:
        description: "Sadece analiz + üretim; Drive/tablo yazma"
        required: false
        default: false
        type: boolean

concurrency:
  group: analiz-short-uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then exit 0; fi
          for deneme in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=4 update -qq && \
               sudo apt-get -o Acquire::Retries=4 install -y -qq --fix-missing ffmpeg; then exit 0; fi
            sleep $((deneme * 12))
          done
          echo "FFmpeg kurulamadı"; exit 1

      - name: Bağımlılıklar
        run: |
          pip install -q -r requirements-motor.txt openpyxl \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib edge-tts

      - name: Varlıklar (fontlar + fon müziği)
        run: python motor/varlik_hazirla.py

      - name: Görsel regresyon kapısı
        run: |
          python -m unittest discover -s tests -p 'test_pexels_gorsel_pipeline.py' -v
          echo "MOTOR_VISUAL_QA_PASSED=1" >> "$GITHUB_ENV"

      - name: YouTube analizi (salt okunur)
        env:
          BD_ANALYTICS_CLIENT_CONFIG: ${{ secrets.BD_ANALYTICS_CLIENT_CONFIG }}
          BD_ANALYTICS_REFRESH_TOKEN: ${{ secrets.BD_ANALYTICS_REFRESH_TOKEN }}
          GUN: ${{ inputs.gun }}
          ADET: ${{ inputs.adet }}
        run: |
          python yt_analiz.py --days "$GUN" --limit "$ADET" \
            --curve-limit "$ADET" --out yt_analiz.json

      - name: Üret + Telegram onayı + teslim
        env:
          COQUI_TOS_AGREED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS_KEY || secrets.PEXELS_API }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          BD_ANALYTICS_CLIENT_CONFIG: ${{ secrets.BD_ANALYTICS_CLIENT_CONFIG }}
          BD_ANALYTICS_REFRESH_TOKEN: ${{ secrets.BD_ANALYTICS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          ADET: ${{ inputs.adet }}
          ONAY_SN: ${{ inputs.onay_dakika }}
          KURU: ${{ inputs.kuru }}
          MOTOR_VISUAL_QA_PASSED: "1"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          PY
          SURE=$(( ${ONAY_SN:-30} * 60 ))
          ARG="--adet ${ADET:-2} --onay-bekleme-sn $SURE"
          [ "$KURU" = "true" ] && ARG="$ARG --kuru"
          echo "Komut: python analiz_uret.py $ARG"
          set -o pipefail
          python analiz_uret.py $ARG 2>&1 | tee analiz_uretim_logu.txt

      - name: Kayıt dosyalarını depoya yaz
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor/ses_perde_kaydi.csv motor/sozluk_ek_kelimeler.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(motor): analiz üretimi perde kaydı [skip ci]" || true
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" || true
          fi

      - name: Analiz ve üretim çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analiz-short-${{ github.run_number }}
          path: |
            yt_analiz.json
            analiz_uretim_logu.txt
            motor/cikti/analiz/**/final.mp4
            motor/cikti/analiz/**/kapak.jpg
            motor/cikti/analiz/**/yayin_bilgisi.json
          if-no-files-found: warn
          retention-days: 30
