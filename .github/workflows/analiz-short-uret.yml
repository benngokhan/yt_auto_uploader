name: Analizden Short üret (Telegram onaylı)

# Kullanıcı tarafından elle tetiklenir. YouTube Analytics verisiyle en ilgi
# çeken UZUN videoyu bulur, 7 sahneli Short üretir, video+kapağı Telegram'a
# gönderir. 'onayladım' yazılınca Drive video_<N> + baslik.xlsx satırı yazılır.
# 19:30 yayın saatine ve crosspost bayraklarına DOKUNMAZ.

on:
  # API'den dispatch edilemediği için ilk push'ta kendiliğinden başlar.
  # Sonraki kod push'ları tetiklemesin diye yalnızca bu dosya filtrelendi.
  push:
    branches: [wip/shorts-v2-rebuild]
    paths:
      - .github/workflows/analiz-short-uret.yml
  workflow_dispatch:
    inputs:
      adet:
        description: "Üretilecek Short sayısı (önerilen: 2)"
        required: false
        default: "2"
        type: string
      gun:
        description: "Analiz penceresi (gün)"
        required: false
        default: "180"
        type: string
      onay_dakika:
        description: "Her video için Telegram onay süresi (dakika)"
        required: false
        default: "30"
        type: string
      kuru:
        description: "Sadece analiz + üretim; Drive/tablo yazma"
        required: false
        default: false
        type: boolean

concurrency:
  group: analiz-short-uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then exit 0; fi
          for deneme in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=4 update -qq && \
               sudo apt-get -o Acquire::Retries=4 install -y -qq --fix-missing ffmpeg; then exit 0; fi
            sleep $((deneme * 12))
          done
          echo "FFmpeg kurulamadı"; exit 1

      - name: Bağımlılıklar
        run: |
          pip install -q -r requirements-motor.txt openpyxl \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib edge-tts

      - name: Varlıklar (fontlar + fon müziği)
        run: python motor/varlik_hazirla.py

      - name: Görsel regresyon kapısı
        run: |
          python -m unittest discover -s tests -p 'test_pexels_gorsel_pipeline.py' -v
          echo "MOTOR_VISUAL_QA_PASSED=1" >> "$GITHUB_ENV"

      - name: YouTube analizi (salt okunur)
        env:
          BD_ANALYTICS_CLIENT_CONFIG: ${{ secrets.BD_ANALYTICS_CLIENT_CONFIG }}
          BD_ANALYTICS_REFRESH_TOKEN: ${{ secrets.BD_ANALYTICS_REFRESH_TOKEN }}
          GUN: ${{ inputs.gun || '180' }}
          ADET: ${{ inputs.adet || '2' }}
          UZUN_MIN_SN: "120"
          MIN_IZLENME: "50"
        run: |
          python yt_analiz.py --days "$GUN" --limit "$ADET" \
            --curve-limit "$ADET" --out yt_analiz.json

      - name: Cloudflare AI tanı
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          aid=(os.getenv('CLOUDFLARE_ACCOUNT_ID') or '').strip()
          tok=(os.getenv('CLOUDFLARE_API_TOKEN') or '').strip()
          if not aid or not tok:
              print('CF_TANI: secrets eksik')
              raise SystemExit(0)
          for model in ['@cf/black-forest-labs/flux-1-schnell','@cf/stabilityai/stable-diffusion-xl-base-1.0']:
              url=f'https://api.cloudflare.com/client/v4/accounts/{aid}/ai/run/{model}'
              body=json.dumps({'prompt':'a simple red sphere on white background'}).encode()
              req=urllib.request.Request(url,data=body,headers={'Authorization':'Bearer '+tok,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read(); ct=r.headers.get('Content-Type','')
                  print('CF_TANI',model,'OK',ct,len(raw))
              except urllib.error.HTTPError as e:
                  b=e.read().decode('utf-8','replace')[:200]
                  print('CF_TANI',model,'HTTP',e.code,b)
              except Exception as e:
                  print('CF_TANI',model,type(e).__name__)
          PY

      - name: Gemini görsel tanı
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key=(os.getenv('GEMINI_API_KEY') or '').strip()
          if not key:
              print('GEMINI_TANI: key yok')
              raise SystemExit(0)
          try:
              with urllib.request.urlopen(f'https://generativelanguage.googleapis.com/v1beta/models?key={key}', timeout=60) as r:
                  data=json.load(r)
              isimler=[m.get('name','') for m in data.get('models',[]) if 'image' in m.get('name','').lower()]
              print('GEMINI_TANI modeller:', ', '.join(isimler[:20]) or 'image modeli yok')
          except urllib.error.HTTPError as e:
              print('GEMINI_TANI liste HTTP', e.code, e.read().decode('utf-8','replace')[:200])
          for model in ['gemini-2.5-flash-image','gemini-2.5-flash-image-preview']:
              body=json.dumps({'contents':[{'parts':[{'text':'a simple red sphere on white background'}]}],'generationConfig':{'responseModalities':['TEXT','IMAGE']}}).encode()
              req=urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}',data=body,headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read()
                  print('GEMINI_TANI',model,'OK',len(raw))
              except urllib.error.HTTPError as e:
                  print('GEMINI_TANI',model,'HTTP',e.code,e.read().decode('utf-8','replace')[:200])
              except Exception as e:
                  print('GEMINI_TANI',model,type(e).__name__)
          PY

      - name: Üret + Telegram onayı + teslim
        env:
          COQUI_TOS_AGREED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS_KEY || secrets.PEXELS_API }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          BD_ANALYTICS_CLIENT_CONFIG: ${{ secrets.BD_ANALYTICS_CLIENT_CONFIG }}
          BD_ANALYTICS_REFRESH_TOKEN: ${{ secrets.BD_ANALYTICS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          ADET: ${{ inputs.adet || '2' }}
          ONAY_SN: ${{ inputs.onay_dakika || '30' }}
          KURU: ${{ inputs.kuru || 'false' }}
          V2_ANLATIM_MAX: "260"
          MOTOR_VISUAL_QA_PASSED: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          PY
          SURE=$(( ${ONAY_SN:-30} * 60 ))
          ARG="--adet ${ADET:-2} --onay-bekleme-sn $SURE"
          [ "$KURU" = "true" ] && ARG="$ARG --kuru"
          echo "Komut: python analiz_uret.py $ARG"
          set -o pipefail
          python -u analiz_uret.py $ARG 2>&1 | tee analiz_uretim_logu.txt

      - name: Kayıt dosyalarını depoya yaz
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor/ses_perde_kaydi.csv motor/sozluk_ek_kelimeler.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(motor): analiz üretimi perde kaydı [skip ci]" || true
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" || true
          fi

      - name: Analiz ve üretim çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analiz-short-${{ github.run_number }}
          path: |
            yt_analiz.json
            analiz_uretim_logu.txt
            motor/cikti/analiz/**/final.mp4
            motor/cikti/analiz/**/kapak.jpg
            motor/cikti/analiz/**/yayin_bilgisi.json
            motor/cikti/analiz/**/gorseller/gorsel_secim_raporu.json
            motor/cikti/gorseller/gorsel_secim_raporu.json
          if-no-files-found: warn
          retention-days: 30
