name: KartaL AI v2 temporary build and emulator checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd-kartal-v2-temp-20261031
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build signed release and JVM tests
        working-directory: android_kartal_v2
        env:
          BD_KEYSTORE: ${{ runner.temp }}/bd-kartal-v2.p12
          BD_KEYSTORE_B64: ${{ secrets.BD_JARVIS_SIGNING_KEYSTORE }}
          BD_KEYSTORE_PASS: ${{ secrets.BD_JARVIS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BD_KEYSTORE_B64"; test -n "$BD_KEYSTORE_PASS"
          printf '%s' "$BD_KEYSTORE_B64" | base64 --decode > "$BD_KEYSTORE"
          chmod 600 "$BD_KEYSTORE"
          trap 'rm -f "$BD_KEYSTORE"' EXIT
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify package, signing, permissions and artifacts
        working-directory: android_kartal_v2
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/KartaL_AI_v2.apk
          cp app/build/outputs/apk/debug/app-debug.apk output/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/androidTest.apk
          cp ci/previous.apk output/previous.apk
          cp app/build/test-results/testDebugUnitTest/*.xml output/
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs output/KartaL_AI_v2.apk | tee output/signature.txt
          "$BT/aapt" dump badging output/KartaL_AI_v2.apk | tee output/badging.txt
          "$BT/aapt" dump permissions output/KartaL_AI_v2.apk | tee output/permissions.txt
          "$BT/aapt" dump xmltree output/KartaL_AI_v2.apk AndroidManifest.xml > output/manifest.txt
          grep -q "package: name='com.bilgidozu.jarvis' versionCode='2'" output/badging.txt
          grep -q 'android.permission.INTERNET' output/permissions.txt
          if grep -Eq 'android.permission.(SCHEDULE_EXACT_ALARM|RECEIVE_BOOT_COMPLETED|RECORD_AUDIO)' output/permissions.txt; then echo 'Unexpected alarm, boot or microphone permission'; exit 1; fi
          if grep -Eq 'JarvisAccessibilityService|AlarmReceiver|BootReceiver' output/manifest.txt; then echo 'Legacy auto trigger leaked into release'; exit 1; fi
          if grep -Eq 'android:debuggable.*0xffffffff' output/manifest.txt; then echo 'Release is debuggable'; exit 1; fi
          sha256sum output/KartaL_AI_v2.apk | tee output/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kartal-v2-build
          path: android_kartal_v2/output/
          retention-days: 2
  emulator:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kartal-v2-build
          path: output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Instrumentation and signed version 1 upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true
            adb install -r output/debug.apk
            adb install -r output/androidTest.apk
            adb shell am instrument -w -r com.bilgidozu.jarvis.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r' | tee "$RUNNER_TEMP/tests-${{ matrix.api }}.txt"
            grep -q 'OK (5 tests)' "$RUNNER_TEMP/tests-${{ matrix.api }}.txt"
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' "$RUNNER_TEMP/tests-${{ matrix.api }}.txt"
            adb uninstall com.bilgidozu.jarvis.test
            adb uninstall com.bilgidozu.jarvis
            adb install output/previous.apk
            adb install -r output/KartaL_AI_v2.apk | tee "$RUNNER_TEMP/upgrade-${{ matrix.api }}.txt"
            adb shell dumpsys package com.bilgidozu.jarvis | grep 'versionCode=2' >> "$RUNNER_TEMP/upgrade-${{ matrix.api }}.txt"
            adb logcat -c
            adb shell am start -W -n com.bilgidozu.jarvis/.MainActivity | tr -d '\r' | tee "$RUNNER_TEMP/release-${{ matrix.api }}.txt"
            grep -q 'Status: ok' "$RUNNER_TEMP/release-${{ matrix.api }}.txt"
            adb shell pidof com.bilgidozu.jarvis
            adb exec-out screencap -p > "$RUNNER_TEMP/release-${{ matrix.api }}.png"
            ! adb shell logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kartal-v2-emulator-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/tests-${{ matrix.api }}.txt
            ${{ runner.temp }}/upgrade-${{ matrix.api }}.txt
            ${{ runner.temp }}/release-${{ matrix.api }}.txt
            ${{ runner.temp }}/release-${{ matrix.api }}.png
          if-no-files-found: ignore
          retention-days: 2
