name: Tablo geri yukle (tek seferlik)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Drive tablosunu duzeltilmis surumle degistir
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          Path('token.json').write_text(os.environ['GOOGLE_TOKEN_JSON'])
          c = Credentials.from_authorized_user_file('token.json')
          if not c.valid: c.refresh(Request())
          d = build('drive','v3',credentials=c,cache_discovery=False)
          p = 'veri/tablo_duzeltilmis.xlsx'
          print('yukleniyor', os.path.getsize(p), 'bayt')
          d.files().update(fileId='17nS-VEILQ72k7NKEbYcnji90p1G5UbZZ',
              media_body=MediaFileUpload(p, mimetype='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', resumable=True)).execute()
          m = d.files().get(fileId='17nS-VEILQ72k7NKEbYcnji90p1G5UbZZ', fields='id,name,size,modifiedTime').execute()
          print('SONUC', m)
          PY
