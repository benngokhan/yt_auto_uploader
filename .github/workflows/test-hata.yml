name: Test - bilerek hata (elle)

# Tamirci botunu (ajan_heal) denemek icin elle tetiklenir.
# 1. denemede bilerek hata verir. Bot isi yeniden baslatirsa (2. deneme) basarili olur,
# boylece test kendini toparlar ve sonsuz dongu olusturmaz.
# Hicbir yayin/uretim islemi yapmaz.

on:
  workflow_dispatch:
    inputs:
      tur:
        description: "Hata tipi"
        required: true
        type: choice
        default: "gecici"
        options:
          - "gecici"       # 429 -> bot tekrar dener
          - "anlasilmaz"   # taninmayan -> bot sadece uyarir

permissions:
  contents: read

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TUR: ${{ inputs.tur }}
    steps:
      - name: Bilerek hata uret
        run: |
          echo "deneme no: $GITHUB_RUN_ATTEMPT | tur: $TUR"
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Tamirci yeniden baslatti; bu sefer sorun yok."
            exit 0
          fi
          if [ "$TUR" = "gecici" ]; then
            echo "HTTP 429 Too Many Requests - rate limit exceeded (bilerek uretildi)"
          else
            echo "Beklenmeyen bir durum olustu (bilerek uretildi, taninmayan hata)"
          fi
          exit 1
