name: MD -> Drive (CEO klasörü)

# Elle tetiklenir. Repodaki bir .md dosyasını Drive CEO klasörüne yükler.
on:
  workflow_dispatch:
    inputs:
      dosya:
        description: "Repodaki dosya adı"
        required: true
        default: "MOTOR_SORULARI.md"
      hedef_klasor:
        description: "Drive klasör ID (boş = CEO)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Yükle
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DOSYA: ${{ inputs.dosya }}
          HEDEF: ${{ inputs.hedef_klasor }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          creds = Credentials.from_authorized_user_file("token.json")
          if not creds.valid:
              creds.refresh(Request())
          drive = build("drive", "v3", credentials=creds)

          dosya = os.environ["DOSYA"].strip()
          klasor = os.environ.get("HEDEF", "").strip() or "1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC"
          medya = MediaFileUpload(dosya, mimetype="text/markdown", resumable=False)
          sonuc = drive.files().create(
              body={"name": Path(dosya).name, "parents": [klasor]},
              media_body=medya, fields="id,name,webViewLink,size",
          ).execute()
          print("YÜKLENDİ:", json.dumps(sonuc, ensure_ascii=False))
          PY
