name: API durum ve limit görüntüsü
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
  actions: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sağlayıcı durumlarını kontrol et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS_KEY || secrets.PEXELS_API }}
        run: python api_durum_kontrol.py
      - name: Görüntüyü kaydet
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add api_durum.json
          git diff --cached --quiet || (git commit -m 'API durum görüntüsünü güncelle [skip ci]' && git pull --rebase --autostash origin main && git push origin HEAD:main)
