name: Panel Telemetri & Drive Senkron (30 Dk)
# Admin Paneli için her 30 dakikada bir (0 YouTube API kotası ile) Google Drive YOUTUBE_OTOMASYON
# klasörlerini, CEO yükleme tablosunu ve Özel Retansiyon Raporunu tarayıp panel_telemetry.json günceller.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      push_table_to_drive:
        description: "Panelde düzenlenen Excel tablosunu Google Drive CEO klasörüne yaz"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: panel-telemetry-sync
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          PY

      - name: Sync Drive inventory, table & retention telemetry (0 YouTube API Quota)
        run: |
          if [ "${{ inputs.push_table_to_drive }}" = "true" ]; then
            python sync_panel_telemetry.py --push-table-to-drive
          else
            python sync_panel_telemetry.py
          fi

      - name: Begeni sayilarini topla (likes.json)
        run: |
          pip install -q yt-dlp
          python stats_likes.py || echo "Begeni toplama kismen basarisiz (kritik degil)."

      - name: Site anlik goruntusu (shorts_top.json) uret
        run: python export_site_snapshot.py || true

      - name: Herkese acik siteye yayinla (benngokhan.github.io)
        env:
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python publish_site_snapshot.py || echo "Site yayini basarisiz (kritik degil)."

      - name: Commit updated telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel_telemetry.json bilgidozu_yukleme_tablosu.xlsx shorts_top.json likes.json
          git diff --cached --quiet || (git commit -m "chore: 30dk panel telemetri ve Drive stok senkronu [skip ci]" && git pull --rebase --autostash origin main && git push origin HEAD:main)
