name: Analizli konu önerilerini güncelle
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: konu-onerileri
  cancel-in-progress: true
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 openpyxl
      - name: Drive geçmişini kontrol et ve önerileri üret
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WORKBOOK_ID: 1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo
          APPROVAL_FOLDER: 1xyO_jNjbpghfR7CJ1P9DUvkzdb6eC0qf
        run: python konu_onerileri_uret.py
      - name: Güncel önerileri kaydet
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add konu_onerileri.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m 'Konu önerilerini gerçek geçmişe göre güncelle [skip ci]'
          # Aynı anda başka bir iş push edebilir; birkaç kez pull --rebase ile dene.
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              ok=1; break
            fi
            echo "push denemesi $i başarısız, 8 sn sonra tekrar..."
            sleep 8
          done
          [ "$ok" = 1 ] || { echo "::error::main'e push yapılamadı"; exit 1; }
