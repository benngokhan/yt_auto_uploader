name: TikTok Only Test

on:
  workflow_dispatch:
    inputs:
      force_file:
        description: "Test edilecek short dosya adı (örn. video_188.mp4)"
        required: true
        type: string
        default: "video_188.mp4"

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CROSSPOST_ENABLED: 'true'
      TIKTOK_ENABLED: 'true'
      INSTAGRAM_ENABLED: 'false'
      TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
      TIKTOK_DATACENTER: ${{ secrets.TIKTOK_DATACENTER }}
      INPUT_FORCE_FILE: ${{ inputs.force_file }}
      ALLOW_FORCE_FILE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_QUEUE_FOLDER_ID: '1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC'
          SHEETS_ID: '1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["GOOGLE_CLIENT_SECRETS_JSON", "GOOGLE_TOKEN_JSON"]
          missing = [k for k in required if not os.getenv(k, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8")) if Path("config.json").exists() else {}
          cfg["drive_queue_folder_id"] = os.getenv("DRIVE_QUEUE_FOLDER_ID", "").strip() or "1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC"
          cfg["sheets_id"] = os.getenv("SHEETS_ID", "").strip() or "1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo"
          cfg["privacy_status"] = "private"
          Path("config.json").write_text(json.dumps(cfg, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: TikTok'a sadece test paylaşımı (YouTube yok)
        run: python tiktok_only_test.py
