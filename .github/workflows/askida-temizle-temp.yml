name: Askida temizle (gecici)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib openpyxl
      - name: Temizle
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SHORTS_FOLDER: "1GK-yImpb09445uXfTUbIl7l6AfNM4BOb"
          QUEUE_FOLDER: "1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC"
          TABLE_ID: "1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo"
        run: |
          python - <<'PYEOF'
          import os, io, json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload, MediaIoBaseUpload
          import openpyxl

          ASKIDA_PREFIXES = ["video_194","video_195","video_196"]
          DOSYALAR = []
          for n in [194,195,196]:
              DOSYALAR += [f"video_{n}.mp4", f"kapak_{n}.jpg", f"kapak_{n}.png"]

          open("token.json","w",encoding="utf8").write(os.environ["GOOGLE_TOKEN_JSON"])
          creds=Credentials.from_authorized_user_file("token.json")
          if not creds.valid: creds.refresh(Request())
          drive=build("drive","v3",credentials=creds)

          FOLDERS=[os.environ["SHORTS_FOLDER"], os.environ["QUEUE_FOLDER"]]
          seen=set(); deleted=[]
          for folder in FOLDERS:
              for name in DOSYALAR:
                  q=f"'{folder}' in parents and name='{name}' and trashed=false"
                  res=drive.files().list(q=q, fields="files(id,name,parents)", pageSize=10).execute().get("files",[])
                  for f in res:
                      if f["id"] in seen: continue
                      seen.add(f["id"])
                      drive.files().delete(fileId=f["id"]).execute()
                      deleted.append({"name":f["name"],"id":f["id"],"folder":folder})
                      print("SILINDI", f["name"], f["id"])

          # tablo
          tid=os.environ["TABLE_ID"]
          buf=io.BytesIO()
          dl=MediaIoBaseDownload(buf, drive.files().get_media(fileId=tid))
          done=False
          while not done: _,done=dl.next_chunk()
          buf.seek(0)
          wb=openpyxl.load_workbook(buf)
          ws=wb["DRIVE"] if "DRIVE" in wb.sheetnames else wb.active
          sil_satirlar=[]
          for r in range(2, ws.max_row+1):
              st=str(ws.cell(r,1).value or "").strip().upper()
              fn=str(ws.cell(r,2).value or "").strip()
              if "ASKIDA" in st and any(fn.startswith(p) or fn==f"{p}.mp4" for p in ASKIDA_PREFIXES):
                  sil_satirlar.append((r, st, fn))
          for r,st,fn in reversed(sil_satirlar):
              print("SATIR_SIL", r, st, fn)
              ws.delete_rows(r,1)
          out=io.BytesIO(); wb.save(out); out.seek(0)
          drive.files().update(fileId=tid, media_body=MediaIoBaseUpload(out, mimetype="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", resumable=False)).execute()
          print("TABLO_GUNCELLENDI", len(sil_satirlar))
          print("OZET", json.dumps({"deleted_files":deleted,"deleted_rows":[x[2] for x in sil_satirlar]}, ensure_ascii=False))
          PYEOF
