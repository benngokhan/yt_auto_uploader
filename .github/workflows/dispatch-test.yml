name: Dispatch Test
# Haftalik "yayincinin tabloya view yazmasi" isini otomatize eder.
# SIHIR YouTube API kotası harcamaz (yt-dlp scraping); her gün 09:00 TR.
# Tablo repo master'a yazilir; sonraki ana workflow run'i Drive'a sync'ler (ikili senkron kurali).

on:
  schedule:
    - cron: "45 6 * * *"   # 09:45 TR (off-peak; 06:00Z tam saat atlandi)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece hesapla, tabloya yazma"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp + openpyxl
        run: pip install -q yt-dlp openpyxl

      - name: View sayilari topla (YouTube API kotası: 0)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python stats_views.py --dry-run
          else
            python stats_views.py
          fi

      - name: Tabloyu commit + push (Drive sync sonraki ana run'da)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilgidozu_yukleme_tablosu.xlsx stats_summary.json
          git diff --cached --quiet || git commit -m "chore: goruntülenme raporu (yt-dlp, 0 kota)"
          git push

      - name: Telegram raporu
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit(0)

          status = os.getenv("JOB_STATUS", "")
          run_url = os.getenv("RUN_URL", "")
          sfile = Path("stats_summary.json")

          if status != "success" or not sfile.exists():
              text = f"❌ <b>Görüntülenme Raporu Hatası</b>\nDurum: <code>{status}</code>"
              payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML",
                         "reply_markup": {"inline_keyboard": [[{"text": "🔍 Kaydı Gör", "url": run_url}]]}}
          else:
              s = json.loads(sfile.read_text(encoding="utf-8"))
              top = "\n".join(
                  f"• <b>+{t['delta']:,}</b> {t['title'][:55]}" for t in s.get("top", [])[:3]
              ) or "—"
              text = (
                  "📊 <b>Bilgi Dozu — Görüntülenme Raporu</b>\n\n"
                  f"Toplam: <b>{s['total']:,}</b>\n"
                  f"Son rapordan beri: <b>+{s['day_gain']:,}</b>\n\n"
                  "En çok yükselen:\n"
                  f"{top}\n\n"
                  "Tablo güncellendi ✓ · Kota: 0"
              )
              payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15).read()
          PY
