name: YouTube Drive Uploader

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate configuration only; do not upload"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "30 19 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: yt-drive-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON || vars.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON || vars.GOOGLE_TOKEN_JSON }}
          DRIVE_QUEUE_FOLDER_ID: ${{ secrets.DRIVE_QUEUE_FOLDER_ID || vars.DRIVE_QUEUE_FOLDER_ID || vars.DRIVE_QUEUE_FOLDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY || vars.AGROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["GOOGLE_CLIENT_SECRETS_JSON", "GOOGLE_TOKEN_JSON", "DRIVE_QUEUE_FOLDER_ID"]
          missing = [k for k in required if not os.getenv(k, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8")) if Path("config.json").exists() else {}
          cfg["drive_queue_folder_id"] = os.environ["DRIVE_QUEUE_FOLDER_ID"].strip()
          cfg["privacy_status"] = "private"
          if os.getenv("GEMINI_API_KEY"): cfg["gemini_api_key"] = os.environ["GEMINI_API_KEY"]
          if os.getenv("GROQ_API_KEY"): cfg["groq_api_key"] = os.environ["GROQ_API_KEY"]
          Path("config.json").write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          PY

      - name: Telegram start notification
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; start notification skipped."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 15 \
            --get "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=▶️ YouTube otomasyonu başladı.
            Çalıştırma: ${RUN_URL}"

      - name: Validate configuration (manual dry run)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from uploader import get_google_clients, load_config
          cfg = load_config()
          creds = Credentials.from_authorized_user_file("token.json")
          granted_scopes = set(creds.scopes or [])
          if "https://www.googleapis.com/auth/youtube.upload" not in granted_scopes:
              raise SystemExit("OAuth token is missing the youtube.upload scope; re-authorize with uploader.py's configured scopes.")
          _, drive = get_google_clients()
          drive.files().list(q=f"'{cfg['drive_queue_folder_id']}' in parents and trashed=false", pageSize=1, fields="files(id,name)").execute()
          print("VALIDATION OK: YouTube upload scope is present and Drive access succeeded. No video uploaded.")
          PY

      - name: Upload one queued video
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: python uploader.py --now

      - name: Persist duplicate-prevention log
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: |
          if [ -f uploaded.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploaded.txt
            git diff --cached --quiet || git commit -m "chore: record uploaded Drive video"
            git push
          fi

      - name: Telegram result notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; result notification skipped."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_TEXT="✅ GitHub otomasyon adımları başarılı."
          else
            STATUS_TEXT="❌ GitHub otomasyonunda hata oluştu. Ayrıntı için çalıştırma kayıtlarını aç."
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            STATUS_TEXT="🧪 Bağlantı testi sonucu: $JOB_STATUS"
          fi
          curl --fail --silent --show-error --max-time 15 \
            --get "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${STATUS_TEXT}
            Çalıştırma: ${RUN_URL}"
