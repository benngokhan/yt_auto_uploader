name: YouTube Drive Uploader

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece tablo ve Drive bağlantısını test et (Video yükleme)"
        required: true
        type: boolean
        default: false
      video_type:
        description: "Video türü: auto (Prime Time Takvimi) | short (Shorts) | long (Uzun Video)"
        required: false
        type: string
        default: "auto"
  schedule:
    # Türkiye Saati (UTC+3) Strateji Masası 2 Slot Kuralı (aynı gün aynı sütun; Cuma Uzun Video):
    # 1) 19:00 TR (16:00 UTC) -> Slot 1
    - cron: "0 16 * * *"
    # 2) 23:00 TR (20:00 UTC) -> Slot 2
    - cron: "0 20 * * *"
    # 3) 10:05 TR (07:05 UTC) -> KACIRILAN SLOT TELAFISI
    #    Yalnizca dun eksik slot varsa calisir (kota 10:00 TR'de sifirlanir)
    - cron: "5 7 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: yt-drive-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON || vars.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON || vars.GOOGLE_TOKEN_JSON }}
          DRIVE_QUEUE_FOLDER_ID: '1GOsIP3xZWV5jjeKZulEkUjyIzc_jFNZ6'
          SHEETS_ID: ''
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY || vars.AGROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["GOOGLE_CLIENT_SECRETS_JSON", "GOOGLE_TOKEN_JSON"]
          missing = [k for k in required if not os.getenv(k, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8")) if Path("config.json").exists() else {}
          raw_folder = os.getenv("DRIVE_QUEUE_FOLDER_ID", "1GOsIP3xZWV5jjeKZulEkUjyIzc_jFNZ6").strip()
          if not raw_folder or raw_folder in ("1MBjwKp1DXoxLiCAkds84MowZAFMOK7Br", "1w8tz_lv7iMFsRRCaTKUSY_ri0F107rz_"):
              raw_folder = "1GOsIP3xZWV5jjeKZulEkUjyIzc_jFNZ6"
          cfg["drive_queue_folder_id"] = raw_folder
          cfg["sheets_id"] = ""
          cfg["privacy_status"] = "public"
          if os.getenv("GEMINI_API_KEY"): cfg["gemini_api_key"] = os.environ["GEMINI_API_KEY"]
          if os.getenv("GROQ_API_KEY"): cfg["groq_api_key"] = os.environ["GROQ_API_KEY"]
          Path("config.json").write_text(json.dumps(cfg, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Validate configuration (manual dry run — ZERO YouTube API quota!)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from uploader import get_google_clients, load_config, validate_metadata_workbook
          cfg = load_config()
          creds = Credentials.from_authorized_user_file("token.json")
          granted_scopes = set(creds.scopes or [])
          if "https://www.googleapis.com/auth/youtube.upload" not in granted_scopes:
              raise SystemExit("OAuth token is missing the youtube.upload scope; re-authorize with uploader.py's configured scopes.")
          # SADECE Drive ve Tablo doğrulanır — YouTube Data API kotasından 0 birim harcanır!
          _youtube, drive = get_google_clients()
          drive.files().list(q=f"'{cfg['drive_queue_folder_id']}' in parents and trashed=false", pageSize=10, fields="files(id,name)").execute()
          print(validate_metadata_workbook(drive, cfg["drive_queue_folder_id"]))
          manifest = json.loads(Path("approved_new_series_manifest.json").read_text(encoding="utf-8"))
          print(f"VALIDATION OK (0 YouTube Quota Spent): {len(manifest.get('approved_videos', {}))} approved videos in manifest.")
          PY

      - name: Kacirilan slot telafisi kontrolu (yalnizca 10:05 TR)
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          should = "true"
          run = os.environ.get("GITHUB_EVENT_SCHEDULE", "").strip()
          if run.startswith("5 7 "):
              stamps = []
              p = Path("uploaded.txt")
              if p.exists():
                  for line in p.read_text(encoding="utf-8").splitlines():
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = [x.strip() for x in line.split("|")]
                      if len(parts) >= 4:
                          try:
                              stamps.append(datetime.strptime(parts[3], "%Y-%m-%d %H:%M").replace(tzinfo=timezone.utc))
                          except ValueError:
                              pass
              now_tr = datetime.now(timezone.utc) + timedelta(hours=3)
              yday = (now_tr - timedelta(days=1)).date()
              # Sadece AKSAM slotlari sayilir (18:00 TR sonrasi) — sabah/ara yuklemeler sayilmaz
              done = sum(
                  1
                  for ts in stamps
                  if (ts + timedelta(hours=3)).date() == yday and (ts + timedelta(hours=3)).hour >= 18
              )
              expected = 1 if yday.weekday() == 4 else 2
              if done >= expected:
                  should = "false"
                  print(f"Telafi: {yday} gunu {done}/{expected} slot tamam -> sabah slotu atlaniyor.")
              else:
                  print(f"Telafi: {yday} gunu {done}/{expected} slot -> KACIRILAN SLOT YAKALANIYOR.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={should}\n")
          PY

      - name: Upload one queued video (Prime Time Schedule)
        if: ${{ (github.event_name == 'schedule' && steps.guard.outputs.should_run != 'false') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          INPUT_VIDEO_TYPE: ${{ inputs.video_type || 'auto' }}
        run: |
          if [ "$INPUT_VIDEO_TYPE" = "short" ]; then
            python uploader.py --now --short
          elif [ "$INPUT_VIDEO_TYPE" = "long" ]; then
            python uploader.py --now --long
          else
            python uploader.py --now
          fi

      - name: Persist duplicate-prevention log
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: |
          if [ -f uploaded.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploaded.txt status_report.json bilgidozu_yukleme_tablosu.xlsx baslik.xlsx
            [ -f .healed_131_thumb ] && git add -f .healed_131_thumb || true
            git diff --cached --quiet || git commit -m "chore: record uploaded Bilgi Dozu video [skip ci]"
            git push
          fi

      - name: Telegram VIP Bildirimi
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit(0)

          status = os.getenv("JOB_STATUS", "")
          run_url = os.getenv("RUN_URL", "")
          payload_file = Path("last_upload_payload.json")

          if status == "success" and payload_file.exists():
              payload = json.loads(payload_file.read_text(encoding="utf-8"))
              payload["chat_id"] = chat_id
          elif status != "success":
              payload = {
                  "chat_id": chat_id,
                  "text": f"❌ <b>Bilgi Dozu Otomasyon Уyarısı</b>\nDurum: <code>{status}</code>",
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
                  "reply_markup": {
                      "inline_keyboard": [[{"text": "🔍 Hata Kaydını Gör", "url": run_url}]]
                  },
              }
          else:
              raise SystemExit(0)

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15).read()
          PY
