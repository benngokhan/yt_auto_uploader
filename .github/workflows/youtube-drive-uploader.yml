name: YouTube Drive Uploader

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece tablo ve Drive bağlantısını test et (Video yükleme)"
        required: true
        type: boolean
        default: false
      video_type:
        description: "Video türü: auto (Prime Time Takvimi) | short (Shorts) | long (Uzun Video)"
        required: false
        type: string
        default: "auto"
      force_file:
        description: "İsteğe bağlı tam dosya adı; sıra dışındaki dosyalar alınmaz."
        required: false
        type: string
        default: ""
      recovery_slot:
        description: "Yalnız bekçi telafisi için UTC slot kimliği (YYYY-MM-DDTHH:MMZ)."
        required: false
        type: string
        default: ""
  schedule:
    # Türkiye (UTC+03): Günde tek yayın, 19:30.
    # Cuma 19:30 Uzun Video; diğer günler 19:30 Shorts.
    - cron: "12 16 * * *"  # 19:12 Türkiye erken ısınma
    - cron: "30 16 * * *"  # 19:30 Türkiye ana slot

permissions:
  actions: read
  contents: write

concurrency:
  group: yt-drive-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Sahip onayı (27.11.2026): yalnızca TikTok açık; Instagram kapalı kalır.
      # TIKTOK_SESSIONID GitHub Secret'tan okunur; secret yoksa Drive keys dosyası kullanılır.
      # Acil durdurma: CROSSPOST_ENABLED değerini 'false' yapman yeterli.
      CROSSPOST_ENABLED: 'true'
      TIKTOK_ENABLED: 'true'
      INSTAGRAM_ENABLED: 'false'
      TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test full suite (scheduled runs)
        if: github.event_name != 'workflow_dispatch'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test critical safeguards (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python -m unittest
          tests.test_sequential_queue
          tests.test_crosspost_user_disabled
          tests.test_delivery_diagnostics
          tests.test_upload_reporting_integration
          tests.test_watchdog_dispatch
          -v

      - name: Resolve publication slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          RECOVERY_SLOT: ${{ inputs.recovery_slot || '' }}
        run: python slot_guard.py

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_QUEUE_FOLDER_ID: '1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC'
          SHEETS_ID: '1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ["GOOGLE_CLIENT_SECRETS_JSON", "GOOGLE_TOKEN_JSON"]
          missing = [k for k in required if not os.getenv(k, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8")) if Path("config.json").exists() else {}
          raw_folder = os.getenv("DRIVE_QUEUE_FOLDER_ID", "1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC").strip()
          if not raw_folder:
              raw_folder = "1ttP8K3VHtqaNtdSlWjqIFza8Kzf0wxpC"
          cfg["drive_queue_folder_id"] = raw_folder
          cfg["sheets_id"] = os.getenv("SHEETS_ID", "1aBt7me8IOzsJeSMQDVtkTktOgF9EZpJo").strip()
          cfg["privacy_status"] = "public"
          Path("config.json").write_text(json.dumps(cfg, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Video onarımı (repair_video.json — push ile tetiklenen tek seferlik düzeltme)
        if: ${{ github.event_name == 'push' && hashFiles('repair_video.json') != '' }}
        run: |
          python uploader.py --repair
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- repair_video.json
          git diff --cached --quiet || git commit -m "chore: video onarımı tamamlandı [skip ci]"
          git push

      - name: Validate configuration (manual dry run — ZERO YouTube API quota!)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from uploader import get_google_clients, load_config, load_uploaded_ids, validate_metadata_workbook
          from sheets_metadata import get_next_scheduled_video
          cfg = load_config()
          creds = Credentials.from_authorized_user_file("token.json")
          granted_scopes = set(creds.scopes or [])
          if "https://www.googleapis.com/auth/youtube.upload" not in granted_scopes:
              raise SystemExit("OAuth token is missing the youtube.upload scope; re-authorize with uploader.py's configured scopes.")
          analytics_scope = "https://www.googleapis.com/auth/yt-analytics.readonly"
          print("ANALYTICS SCOPE:", "YES" if analytics_scope in granted_scopes else "NO")
          # SADECE Drive ve Tablo doğrulanır — YouTube Data API kotasından 0 birim harcanır!
          _youtube, drive = get_google_clients()
          drive.files().list(q=f"'{cfg['drive_queue_folder_id']}' in parents and trashed=false", pageSize=10, fields="files(id,name)").execute()
          try:
              import io, openpyxl
              from googleapiclient.http import MediaFileUpload
              from sheets_metadata import DEFAULT_SHEETS_ID, _download_workbook_bytes_from_drive
              dl_wb = _download_workbook_bytes_from_drive(drive, cfg["drive_queue_folder_id"])
              if dl_wb and Path("baslik.xlsx").exists():
                  wb_buf, wb_name = dl_wb
                  wb_d = openpyxl.load_workbook(wb_buf, data_only=True)
                  print(f"CANLI DRIVE TABLOSU OKUNDU: {wb_name} ({len(wb_d.sheetnames)} sekme)")
          except Exception as sync_err:
              print("Drive tablo senkron uyarısı:", sync_err)
          print(validate_metadata_workbook(drive, cfg["drive_queue_folder_id"]))
          done = load_uploaded_ids(Path(cfg.get("uploaded_list", "uploaded.txt")))
          next_short = get_next_scheduled_video(drive, cfg["drive_queue_folder_id"], skip_ids=done, video_type="short")
          next_long = get_next_scheduled_video(drive, cfg["drive_queue_folder_id"], skip_ids=done, video_type="long")
          print(f"SIRADAKI SHORT: {next_short['name'] if next_short else 'BEKLIYOR'}")
          print(f"SIRADAKI UZUN: {next_long['name'] if next_long else 'BEKLIYOR'}")
          manifest = json.loads(Path("approved_new_series_manifest.json").read_text(encoding="utf-8"))
          print(f"VALIDATION OK (0 YouTube Quota Spent): {len(manifest.get('approved_videos', {}))} approved videos in manifest.")
          PY

      - name: Kacirilan slot telafisi kontrolu (yalnizca 10:05 TR)
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          should = "true"
          run = os.environ.get("GITHUB_EVENT_SCHEDULE", "").strip()
          if run.startswith("5 7 "):
              stamps = []
              p = Path("uploaded.txt")
              if p.exists():
                  for line in p.read_text(encoding="utf-8").splitlines():
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = [x.strip() for x in line.split("|")]
                      if len(parts) >= 4:
                          try:
                              stamps.append(datetime.strptime(parts[3], "%Y-%m-%d %H:%M").replace(tzinfo=timezone.utc))
                          except ValueError:
                              pass
              now_tr = datetime.now(timezone.utc) + timedelta(hours=3)
              yday = (now_tr - timedelta(days=1)).date()
              # Sadece AKSAM slotlari sayilir (18:00 TR sonrasi) — sabah/ara yuklemeler sayilmaz
              done = sum(
                  1
                  for ts in stamps
                  if (ts + timedelta(hours=3)).date() == yday and (ts + timedelta(hours=3)).hour >= 18
              )
              expected = 1 if yday.weekday() == 4 else 2
              if done >= expected:
                  should = "false"
                  print(f"Telafi: {yday} gunu {done}/{expected} slot tamam -> sabah slotu atlaniyor.")
              else:
                  print(f"Telafi: {yday} gunu {done}/{expected} slot -> KACIRILAN SLOT YAKALANIYOR.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={should}\n")
          PY

      - name: Reserve the publication slot before contacting YouTube
        id: reserve
        if: ${{ (github.event_name == 'schedule' && steps.guard.outputs.should_run != 'false') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          SLOT_KEY: ${{ steps.slot.outputs.key }}
        run: |
          python slot_guard.py reserve
          if ! git diff --quiet -- slot_claims.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add slot_claims.txt
            git commit -m "chore: reserve publication slot [skip ci]"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload one queued video (Prime Time Schedule)
        id: publish
        if: ${{ steps.reserve.outputs.allow == 'true' }}
        env:
          INPUT_VIDEO_TYPE: ${{ steps.slot.outputs.kind || inputs.video_type || 'auto' }}
          BILGI_SLOT_KEY: ${{ steps.slot.outputs.key }}
          INPUT_FORCE_FILE: ${{ inputs.force_file || '' }}
          ALLOW_FORCE_FILE: ${{ inputs.force_file != '' && '1' || '0' }}
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime, timezone
          from slot_guard import parse_slot
          slot_key = os.getenv("BILGI_SLOT_KEY", "").strip()
          if slot_key and os.getenv("GITHUB_EVENT_NAME") == "schedule":
              slot_dt, _ = parse_slot(slot_key)
              target_start = slot_dt.timestamp() - 75
              wait_sec = target_start - datetime.now(timezone.utc).timestamp()
              if 0 < wait_sec <= 1200:
                  print(f"Erken ısınma başarılı: tam {slot_key} saatinde yayında olması için {int(wait_sec)} sn bekleniyor...")
                  time.sleep(wait_sec)
          PY
          FILE_ARG=""
          if [ -n "$INPUT_FORCE_FILE" ]; then
            FILE_ARG="--file $INPUT_FORCE_FILE"
          fi
          if [ "$INPUT_VIDEO_TYPE" = "short" ]; then
            python uploader.py --now --short $FILE_ARG
          elif [ "$INPUT_VIDEO_TYPE" = "long" ]; then
            python uploader.py --now --long $FILE_ARG
          else
            python uploader.py --now $FILE_ARG
          fi

      - name: Persist duplicate-prevention log
        if: ${{ always() && steps.publish.outcome != 'skipped' && steps.publish.outcome != '' }}
        run: |
          if [ -f uploaded.txt ]; then
            python sync_panel_telemetry.py || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploaded.txt status_report.json panel_telemetry.json bilgidozu_yukleme_tablosu.xlsx baslik.xlsx
            [ -f .healed_131_thumb ] && git add -f .healed_131_thumb || true
            git diff --cached --quiet || git commit -m "chore: record uploaded Bilgi Dozu video [skip ci]"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

      - name: Telegram VIP Bildirimi
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("::warning::Telegram bildirimi gönderilmedi: bot veya sohbet ayarı eksik.")
              raise SystemExit(0)

          status = os.getenv("JOB_STATUS", "")
          run_url = os.getenv("RUN_URL", "")
          payload_file = Path("last_upload_payload.json")

          if status == "success" and payload_file.exists():
              payload = json.loads(payload_file.read_text(encoding="utf-8"))
              payload["chat_id"] = chat_id
          elif status != "success":
              payload = {
                  "chat_id": chat_id,
                  "text": f"❌ <b>Bilgi Dozu Otomasyon Уyarısı</b>\nDurum: <code>{status}</code>",
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
                  "reply_markup": {
                      "inline_keyboard": [[{"text": "🔍 Hata Kaydını Gör", "url": run_url}]]
                  },
              }
          else:
              print("::notice::Yayın kartı yok: gönderilecek Telegram bildirimi bulunmadı.")
              raise SystemExit(0)

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok") or not result.get("result", {}).get("message_id"):
                  raise RuntimeError("Telegram API kabul sonucu dönmedi")
              print("Telegram API mesajı kabul etti; okunduğu anlamına gelmez.")
          except Exception as exc:
              # URL veya hata gövdesi oturum bilgisi içerebilir; yazdırma.
              print(f"::warning::Telegram gönderimi doğrulanamadı ({type(exc).__name__}).")
              raise SystemExit(1) from None
          PY
