name: Gunluk YouTube erken planlama

on:
  schedule:
    # 11:30 Türkiye: Pasifik kota sıfırlaması sonrası; cron gecikse de 19:30 öncesi pay bırakır.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sadece test et; video planlama'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: yt-drive-uploader
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out live state
        uses: actions/checkout@v4
        with:
          ref: main
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Test queue and duplicate safeguards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Configure Google credentials
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name,path in [('GOOGLE_CLIENT_SECRETS_JSON','client_secrets.json'),('GOOGLE_TOKEN_JSON','token.json')]:
              if not os.environ.get(name,'').strip(): raise SystemExit('Google yetkilendirmesi eksik')
              Path(path).write_text(os.environ[name],encoding='utf8')
          PY
      - name: Read-only safety preflight
        id: inspect
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: python bugun_planla.py inspect
      - name: Reserve and persist the exact slot before any upload
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          SLOT: ${{ steps.inspect.outputs.slot }}
        run: |
          python bugun_planla.py reserve
          cd state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slot_claims.txt
          git diff --cached --quiet && exit 1
          git commit -m 'chore: reserve scheduled slot [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Upload once and verify private timed schedule
        id: publish
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          SLOT: ${{ steps.inspect.outputs.slot }}
          FILE: ${{ steps.inspect.outputs.name }}
          FILE_ID: ${{ steps.inspect.outputs.id }}
        run: python bugun_planla.py upload
      - name: Persist upload evidence even on failure
        if: ${{ always() && steps.publish.outcome != 'skipped' && steps.publish.outcome != '' }}
        run: |
          cd state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uploaded.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record scheduled video [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Report scheduled status or failure
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.dry_run) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip()
          chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if not token or not chat:
              print('Telegram ayarı eksik; bildirim gönderilmedi.');raise SystemExit(0)
          path=Path('plan_result.json')
          if path.exists():
              result=json.loads(path.read_text(encoding='utf8'))
              if result.get('status')=='PLANLANDI':
                  text=f"📅 {result['filename']} bugün 19:30 için YouTube'da planlandı. Henüz yayınlanmadı.\n{result['url']}"
                  if not result.get('cover_ok'):text+='\n⚠️ Kapak doğrulanamadı.'
                  if not result.get('sheet_ok'):text+='\n⚠️ Tablo güncellenemedi.'
                  if os.getenv('JOB_STATUS')!='success':text+='\n⚠️ Kayıt adımlarından biri başarısız; kontrol gerekiyor.'
              else:text='⚠️ Video yüklendi ancak yayın saati doğrulanamadı; mükerrer yükleme engellendi.'
          elif os.getenv('JOB_STATUS')!='success':
              text='⚠️ Bugünkü video planlanamadı. Güvenlik gereği tekrar yüklenmedi; kontrol gerekiyor.'
          else:raise SystemExit(0)
          request=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage', data=json.dumps({'chat_id':chat,'text':text}).encode(),headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=15) as r: result=json.load(r)
              print('Telegram kabul etti.' if result.get('ok') else 'Telegram doğrulanamadı.')
          except Exception as exc: print('Telegram gönderilemedi:',type(exc).__name__)
          PY
