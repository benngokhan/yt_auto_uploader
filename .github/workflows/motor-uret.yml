name: Cloudflare Read-Only Safety Preflight
on:
  workflow_dispatch:
    inputs:
      konu:
        required: false
        type: string
      kuru:
        required: false
        type: string
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ inputs.konu == '__CLOUDFLARE_SALT_OKUMA__' && inputs.kuru == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect account usage without model inference
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import datetime,json,math,os,re,urllib.request,urllib.error
          token=os.getenv('CF_TOKEN','').strip(); account=os.getenv('CF_ACCOUNT','').strip()
          if not token or not re.fullmatch('[a-fA-F0-9]{32}',account):
              print('SECRETS_STATUS=missing_or_bad_format');raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def req(path,body=None):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'safe-preflight'}
              if body is not None:headers['Content-Type']='application/json'
              request=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method='POST' if body is not None else 'GET')
              try:
                  with opener.open(request,timeout=30) as r:
                      b=r.read(1024*1024+1)
                      if r.status!=200 or len(b)>1024*1024:return 'invalid_response',None
                      return 'ok',json.loads(b)
              except urllib.error.HTTPError as e:return 'http_'+str(e.code),None
              except Exception as e:return 'error_'+type(e).__name__,None
          status,billing=req('/accounts/'+account+'/subscriptions')
          print('BILLING_READ_STATUS='+status)
          if status=='ok':
              # No assumption that a blank/non-Workers subscription means Free.
              print('BILLING_DATA_READABLE='+str(isinstance(billing,dict) and billing.get('success') is True and isinstance(billing.get('result'),list)).lower())
          date=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          q='query Neurons($account: string!, $date: Date!) { viewer { accounts(filter: {accountTag: $account}) { aiInferenceAdaptiveGroups(limit: 1, filter: {date_geq: $date, date_leq: $date}) { sum { totalNeurons } } } } }'
          status,response=req('/graphql',{'query':q,'variables':{'account':account,'date':date}})
          print('ANALYTICS_STATUS='+status)
          try:
              if status!='ok' or response.get('errors'):raise ValueError('invalid')
              accounts=response['data']['viewer']['accounts']
              if not isinstance(accounts,list) or len(accounts)!=1:raise ValueError('account')
              groups=accounts[0]['aiInferenceAdaptiveGroups']
              if not isinstance(groups,list) or len(groups)>1:raise ValueError('groups')
              used=0.0 if not groups else float(groups[0]['sum']['totalNeurons'])
              if not math.isfinite(used) or used<0:raise ValueError('sum')
              print('UTC_DATE='+date);print('REPORTED_USED_NEURONS='+str(used));print('ANALYTICS_MAY_LAG=true')
          except Exception:print('ANALYTICS_USAGE=unavailable')
          print('INFERENCE_REQUESTS=0; RENDER=0; PUBLISH=0')
          PY
