name: Motor — isolated 30-second cinematic test 082
on:
  workflow_dispatch:
    inputs:
      konu:
        required: true
        type: string
      kuru:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: petrichor-cinematic-082-once
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/arena/petrichor-cinematic-082' && inputs.konu == '__PETRICHOR_CINEMATIC_082_ONCE__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local image validator
        run: python -m pip install 'Pillow==11.1.0'
      - name: Reserve this authorization permanently before any inference
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          repo=os.environ['GH_REPO']
          if repo!='benngokhan/yt_auto_uploader':raise SystemExit('wrong repo')
          claim={'authorization':'PETRICHOR_CINEMATIC_082_ONCE','run_id':os.environ['GH_RUN'],'state':'consumed_before_inference','max_tts':1,'max_images':5,'retry':False,'publication':False}
          body={'branch':'arena/petrichor-cinematic-082','message':'Reserve bounded 082 authorization [skip ci]','content':base64.b64encode(json.dumps(claim).encode()).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/arena_082/claimed.json',data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=40) as r:
                  if r.status!=201:raise ValueError()
          except Exception:raise SystemExit('Reservation failed or uncertain; stopped without retry or inference.')
          print('Authorization reserved permanently for this single run.')
          PY
      - name: Generate once with existing provider integrations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python arena_082/generate.py
      - name: Save only nonsecret results and consumed call journals
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: petrichor-cinematic-082-provider-results
          path: |
            result_082/
            authorization_082/
          if-no-files-found: ignore
          retention-days: 7
