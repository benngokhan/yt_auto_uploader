name: Gemini Charon opening single test
on:
  workflow_dispatch:
    inputs:
      konu:
        required: false
        type: string
      kuru:
        required: false
        type: string
permissions:
  contents: write
jobs:
  single_test:
    if: ${{ inputs.konu == '__GEMINI_CHARON_OPEN_117__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reserve and request once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, urllib.error, wave
          from pathlib import Path
          key=os.getenv('GEMINI_API_KEY','').strip()
          if not key:
              print('STOP: secret missing',flush=True);raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=urllib.request.build_opener(NoRedirect())
          reserve=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/git/refs',
              data=json.dumps({'ref':'refs/heads/arena/gemini-charon-open-consumed-20261122','sha':os.environ['SHA']}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'single-test-guard'},method='POST')
          try:
              with op.open(reserve,timeout=20) as r:
                  if r.status != 201: raise ValueError('reservation failed')
          except Exception as e:
              print('STOP: reservation failed or exists; TYPE='+type(e).__name__,flush=True);raise SystemExit(1)
          print('RESERVATION=created; ONE_TTS_REQUEST=starting',flush=True)
          prompt=('Türkçe konuş. Doğal, dengeli, akıcı ve çok net diksiyonlu bir erkek bilim anlatıcısı gibi konuş. Ne acele et ne de fazla ağırlaş; orta-canlı bir belgesel temposunda her kelimeyi, ekleri ve sessiz harfleri tane tane, pürüzsüz telaffuz et. Cümle aralarında doğal ve kıvamında yarım saniyelik nefes ver.\n\nMetin:\nMum alevi üflendiğinde neden birden sönüyor?\nHiç düşündün mü?')
          body={'contents':[{'parts':[{'text':prompt}]}], 'generationConfig':{'responseModalities':['AUDIO'],'speechConfig':{'voiceConfig':{'prebuiltVoiceConfig':{'voiceName':'Charon'}}}}}
          req=urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent',data=json.dumps(body,ensure_ascii=False).encode(),headers={'x-goog-api-key':key,'Content-Type':'application/json','User-Agent':'single-opening-test'},method='POST')
          try:
              with op.open(req,timeout=150) as r:
                  data=r.read(12000001)
              if len(data)>12000000: raise ValueError('response too large')
              result=json.loads(data); part=result['candidates'][0]['content']['parts'][0]['inlineData']; mime=part.get('mimeType','')
              if not mime.lower().startswith('audio/l16') or ('rate=24000' not in mime.lower()): raise ValueError('unexpected audio format')
              raw=base64.b64decode(part['data'],validate=True)
              if not raw or len(raw)%2 or len(raw)>10000000: raise ValueError('invalid pcm')
              Path('one_audio').mkdir(exist_ok=True)
              with wave.open('one_audio/gemini_charon_baslangic_ham.wav','wb') as w:
                  w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(raw)
              audio=Path('one_audio/gemini_charon_baslangic_ham.wav').read_bytes()
              print('RESULT=AUDIO; SHA256='+hashlib.sha256(audio).hexdigest()+'; PCM_BYTES='+str(len(raw))+'; MIME='+mime,flush=True)
          except urllib.error.HTTPError as e:
              print('RESULT=HTTP_ERROR; STATUS='+str(e.code)+'; NO_RETRY',flush=True);raise SystemExit(1)
          except Exception as e:
              print('RESULT=ERROR; TYPE='+type(e).__name__+'; NO_RETRY',flush=True);raise SystemExit(1)
          PY
      - name: Save audio for human review
        uses: actions/upload-artifact@v4
        with:
          name: gemini-charon-single-opening-117
          path: one_audio/
          if-no-files-found: error
          retention-days: 7
