name: Cloudflare single extinguished candle test
on:
  workflow_dispatch:
    inputs:
      konu:
        required: false
        type: string
      kuru:
        required: false
        type: string
permissions:
  contents: write
jobs:
  single_test:
    if: ${{ inputs.konu == '__CF_EXTINGUISHED_117__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reserve single test and send one request
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          token=os.getenv('CF_TOKEN','').strip(); account=os.getenv('CF_ACCOUNT','').strip()
          if not token or not re.fullmatch('[a-fA-F0-9]{32}',account):
              print('STOP: missing or invalid secret format'); raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=urllib.request.build_opener(NoRedirect())
          # A fixed repository ref is an atomic, persistent reservation for cooperating runs.
          reserve=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/git/refs',
            data=json.dumps({'ref':'refs/heads/arena/cf-extinguished-one-run117-consumed-20261122','sha':os.environ['SHA']}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'single-test-guard'},method='POST')
          try:
              with op.open(reserve,timeout=20) as r:
                  if r.status != 201: raise ValueError('reservation failed')
          except Exception as e:
              print('STOP: reservation failed or already exists',type(e).__name__); raise SystemExit(1)
          print('RESERVATION=created; ONE_INFERENCE_REQUEST=starting',flush=True)
          prompt='Photorealistic vertical 9:16 close-up photograph of one ivory candle after it has been blown out. The candle is completely extinguished, with no flame at all anywhere in the picture. The dark, charred wick is clearly visible, unlit, with a very thin curl of grey smoke rising from it. Visible wax around the black wick. Candle on a plain table in a dark warm cinematic room. No person, no lighter, no match, no text, no logo, no other candles.'
          boundary='arena_single_test_117_4b'
          parts=[]
          for k,v in [('prompt',prompt),('width','720'),('height','1280'),('seed','42817')]:
              parts.append(('--'+boundary+'\r\nContent-Disposition: form-data; name="'+k+'"\r\n\r\n'+v+'\r\n').encode())
          parts.append(('--'+boundary+'--\r\n').encode())
          request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/ai/run/@cf/black-forest-labs/flux-2-klein-4b',data=b''.join(parts),headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'multipart/form-data; boundary='+boundary,'User-Agent':'single-test'},method='POST')
          try:
              with op.open(request,timeout=120) as r:
                  data=r.read(16000001)
                  if len(data)>16000000: raise ValueError('response too large')
                  result=json.loads(data)
                  if result.get('success') is False: raise ValueError('provider rejected request')
                  img=result.get('result',result)
                  raw=base64.b64decode(img['image'],validate=True)
                  if not raw.startswith(b'\x89PNG\r\n\x1a\n') and not raw.startswith(b'\xff\xd8\xff'): raise ValueError('not PNG or JPEG')
                  Path('single_image').mkdir(exist_ok=True)
                  suffix='.png' if raw.startswith(b'\x89PNG') else '.jpg'
                  Path('single_image/sonmus_mum_sahne'+suffix).write_bytes(raw)
                  print('RESULT=IMAGE; SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          except urllib.error.HTTPError as e:
              print('RESULT=HTTP_ERROR; STATUS='+str(e.code)+'; NO_RETRY',flush=True);raise SystemExit(1)
          except Exception as e:
              print('RESULT=ERROR; TYPE='+type(e).__name__+'; NO_RETRY',flush=True);raise SystemExit(1)
          PY
      - name: Save result for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-extinguished-single-candle-117
          path: single_image/
          if-no-files-found: error
          retention-days: 7
