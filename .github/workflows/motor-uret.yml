name: Kuyruk - 097 Fatih videosunu yayın kuyruğuna ekle (tek seferlik)

# Yalnızca kuyruk yazar: video + kapak Drive'a, baslik.xlsx'e BEKLEMEDE satırı.
# YouTube'a yükleme yapmaz; yayın 19:30 TR slotundaki mevcut uploader'a bırakılır.

on:
  workflow_dispatch:
    inputs:
      onay:
        description: One-use queue authorization marker
        required: true
        type: string
      kuru:
        description: Must stay true; queue only, no YouTube upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: queue-097-once
  cancel-in-progress: false

jobs:
  queue:
    if: ${{ github.repository == 'benngokhan/yt_auto_uploader' && github.ref == 'refs/heads/arena/queue-097' && inputs.onay == '__FATIH_097_QUEUE_APPROVED__' && inputs.kuru == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install publication dependencies
        run: python -m pip install -r requirements-publication.txt

      - name: Download the verified 097 render
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45661166999
          name: boston206-render097-results
          path: queue_src

      - name: Configure Google credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.getenv("GOOGLE_TOKEN_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing GitHub Actions secret: GOOGLE_TOKEN_JSON")
          Path("token.json").write_text(raw, encoding="utf-8")
          PY

      - name: Add to Drive queue and baslik.xlsx
        run: python arena_queue_097/queue.py

      - name: Save queue result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: queue-097-result
          path: result_queue_097/
          if-no-files-found: ignore
          retention-days: 7
