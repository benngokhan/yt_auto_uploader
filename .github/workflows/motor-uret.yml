name: Fix - 20261127 baslik ve Drive duzeni

on:
  workflow_dispatch:
    inputs:
      onay:
        description: Yazma onayi (__FIX_20261127_APPLY__)
        required: true
        type: string
      kuru:
        description: true = sadece on-kontrol, false = uygula
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fix-apply-20261127
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == 'benngokhan/yt_auto_uploader' && github.ref == 'refs/heads/arena/fix-20261127' && inputs.onay == '__FIX_20261127_APPLY__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication dependencies
        run: python -m pip install -r requirements-publication.txt
      - name: Configure Google credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.getenv("GOOGLE_TOKEN_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing GitHub Actions secret: GOOGLE_TOKEN_JSON")
          Path("token.json").write_text(raw, encoding="utf-8")
          PY
      - name: Onarim (once on-kontrol, sonra yazma)
        env:
          KURU: ${{ inputs.kuru }}
        run: python arena_fix_20261127/uygula.py
      - name: Save result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-result-20261127
          path: result_fix/
          if-no-files-found: ignore
          retention-days: 7
