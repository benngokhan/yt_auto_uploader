name: Three bounded candle scene tests
on:
  workflow_dispatch:
    inputs:
      konu:
        required: false
        type: string
      kuru:
        required: false
        type: string
permissions:
  contents: write
jobs:
  three_scenes:
    if: ${{ inputs.konu == '__CF_THREE_117__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read isolated test inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve and generate each scene at most once
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python arena_reference/cf_remaining_scenes.py
      - name: Save results for inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-remaining-candle-scenes-117
          path: scene_results/
          if-no-files-found: ignore
          retention-days: 7
