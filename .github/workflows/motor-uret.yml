name: Cloudflare single reference candle test
on:
  workflow_dispatch:
    inputs:
      konu:
        required: false
        type: string
      kuru:
        required: false
        type: string
permissions:
  contents: write
jobs:
  single_test:
    if: ${{ inputs.konu == '__CF_REFERENCE_117__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read isolated test reference
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve the one test and send request
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          token=os.getenv('CF_TOKEN','').strip(); account=os.getenv('CF_ACCOUNT','').strip()
          if not token or not re.fullmatch('[a-fA-F0-9]{32}',account):
              print('STOP=missing_or_invalid_secret_format'); raise SystemExit(1)
          ref=Path('arena_reference/017_positive_reference_320x480.png').read_bytes()
          if hashlib.sha256(ref).hexdigest()!='d7e86053630ef329867e323552c9a20c6911a0c057163d171801dfa5ad2cf682':
              print('STOP=reference_hash_mismatch');raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=urllib.request.build_opener(NoRedirect())
          reserve=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/git/refs',
            data=json.dumps({'ref':'refs/heads/arena/cf-reference-one-run117-consumed-20261122','sha':os.environ['SHA']}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'single-reference-test-guard'},method='POST')
          try:
              with op.open(reserve,timeout=20) as r:
                  if r.status != 201: raise ValueError('reservation failed')
          except Exception as e:
              print('STOP=reservation_failed_or_already_exists; TYPE='+type(e).__name__);raise SystemExit(1)
          print('RESERVATION=created; ONE_INFERENCE_REQUEST=starting',flush=True)
          prompt='Use the attached image as a visual reference for the sideways flame shape and the left-to-right arrangement, not for its dark exposure. Create one photorealistic vertical photograph. An adult woman is on the left, facing a single candle on the right. Her lips are tightly pursed, actively blowing toward the wick. The visible flame is a short narrow golden tongue extending almost horizontally to the RIGHT from the wick, away from her face. Its pointed tip is far to the right of the wick and only slightly higher. Keep a tiny blue base attached to the glowing wick. The surrounding air is invisible: no glowing breath beam, no air ribbon, no drawn motion lines. Natural skin, clear midtone detail, warm light. One candle, no text, no logo.'
          boundary='arena_reference_single_test_117_4b'
          parts=[]
          for k,v in [('prompt',prompt),('width','720'),('height','1280'),('seed','42817')]:
              parts.append(('--'+boundary+'\r\nContent-Disposition: form-data; name="'+k+'"\r\n\r\n'+v+'\r\n').encode())
          parts.append(('--'+boundary+'\r\nContent-Disposition: form-data; name="input_image_0"; filename="reference.png"\r\nContent-Type: image/png\r\n\r\n').encode()+ref+b'\r\n')
          parts.append(('--'+boundary+'--\r\n').encode())
          request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/ai/run/@cf/black-forest-labs/flux-2-klein-4b',data=b''.join(parts),headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'multipart/form-data; boundary='+boundary,'User-Agent':'single-reference-test'},method='POST')
          try:
              with op.open(request,timeout=120) as r:
                  data=r.read(16000001)
                  if len(data)>16000000: raise ValueError('response too large')
                  result=json.loads(data)
                  if result.get('success') is False: raise ValueError('provider rejected request')
                  img=result.get('result',result)
                  raw=base64.b64decode(img['image'],validate=True)
                  if not raw.startswith(b'\x89PNG\r\n\x1a\n') and not raw.startswith(b'\xff\xd8\xff'): raise ValueError('not PNG or JPEG')
                  Path('single_image').mkdir(exist_ok=True)
                  suffix='.png' if raw.startswith(b'\x89PNG') else '.jpg'
                  Path('single_image/referansli_mum_sahne'+suffix).write_bytes(raw)
                  print('RESULT=IMAGE; SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          except urllib.error.HTTPError as e:
              print('RESULT=HTTP_ERROR; STATUS='+str(e.code)+'; NO_RETRY',flush=True);raise SystemExit(1)
          except Exception as e:
              print('RESULT=ERROR; TYPE='+type(e).__name__+'; NO_RETRY',flush=True);raise SystemExit(1)
          PY
      - name: Save result for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-reference-single-candle-117
          path: single_image/
          if-no-files-found: error
          retention-days: 7
