name: Gemini review probe (one payload, three models)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.1.0'
      - name: Import the eight images
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45528376909
          name: boston206-remaining097-results
          path: imported_097
      - name: Probe the real review payload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python arena_097_recovery/probe_review.py
