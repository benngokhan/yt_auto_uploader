name: Fix - 20261127 envanter (salt okunur)

on:
  workflow_dispatch:
    inputs:
      onay:
        description: Read-only inventory marker
        required: true
        type: string
      kuru:
        description: Must stay true
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fix-inventory-20261127
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.repository == 'benngokhan/yt_auto_uploader' && github.ref == 'refs/heads/arena/fix-20261127' && inputs.onay == '__FIX_20261127_READONLY__' && inputs.kuru == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication dependencies
        run: python -m pip install -r requirements-publication.txt
      - name: Configure Google credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.getenv("GOOGLE_TOKEN_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing GitHub Actions secret: GOOGLE_TOKEN_JSON")
          Path("token.json").write_text(raw, encoding="utf-8")
          PY
      - name: Read-only inventory
        run: python arena_fix_20261127/inspect.py
      - name: Save inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-inventory-20261127
          path: inspect/
          if-no-files-found: ignore
          retention-days: 7
