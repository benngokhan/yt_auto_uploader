name: Boston206 — 097 render (reuse 8 agent-reviewed images + approved voice)
on:
  workflow_dispatch:
    inputs:
      konu:
        description: One-use render authorization marker
        required: true
        type: string
      kuru:
        description: Must stay true; no queue/publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: boston206-render-097-once
  cancel-in-progress: false
jobs:
  produce:
    if: ${{ github.repository == 'benngokhan/yt_auto_uploader' && github.ref == 'refs/heads/arena/fatih-remaining-097-render' && inputs.konu == '__FATIH_AUTONOMOUS_097_AGENT_RENDER_ONCE__' && inputs.kuru == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned render dependencies
        run: python -m pip install 'Pillow==11.1.0' 'numpy==2.2.6' 'imageio-ffmpeg==0.6.0'
      - name: Import the eight reviewed images and approved voice from run150
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45528376909
          name: boston206-remaining097-results
          path: imported_097
      - name: Permanently reserve this single render run before any work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='benngokhan/yt_auto_uploader' or os.environ['GITHUB_REF']!='refs/heads/arena/fatih-remaining-097-render' or os.environ['GITHUB_RUN_ATTEMPT']!='1':raise SystemExit('Wrong context; no render')
          claim={'authorization':'FATIH_REMAINING_IMAGES_097_AGENT_REVIEW_ONCE','run_id':os.environ['GITHUB_RUN_ID'],'state':'consumed_before_render','source_run':45528376909,'reused_images':8,'new_tts':0,'new_images':0,'provider_calls':0,'review_method':'agent_vision_review','automatic_retry':False,'publication':False}
          raw=json.dumps(claim).encode()
          body={'branch':'arena/fatih-remaining-097-render','message':'Reserve single097 render authorization [skip ci]','content':base64.b64encode(raw).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/arena_097_render/claimed.json',data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=40) as r:
                  if r.status!=201:raise ValueError()
          except Exception:raise SystemExit('Render reservation failed or uncertain; no retry')
          Path('arena_097_render/claimed.json').write_bytes(raw)
          print('097 render authorization permanently consumed for this single run')
          PY
      - name: Reuse voice and images, render once
        run: python arena_097_render/continue.py
      - name: Save outputs and review journals
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: boston206-render097-results
          path: |
            result_097_render/
            work_097_render/asset_review.json
            work_097_render/plan.json
          if-no-files-found: ignore
          retention-days: 7
