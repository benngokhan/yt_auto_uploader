name: Retansiyon Raporu (Ozel Analytics)
# 11:30 Türkiye: özel Drive raporu. Eski yayın tablosu, YouTube yayını ve git push yok.
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      save_report:
        description: 'Gercek raporu yalniz ozel Drive dosyasina kaydet'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ozel-retansiyon-raporu
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rapor kitapligi
        run: python -m pip install --disable-pip-version-check -q openpyxl==3.1.5
      - name: Guvenlik ve olcum testleri
        run: python -m unittest discover -s tests_retention -p 'test_*.py' -v
      - name: Ozel retansiyon raporu
        env:
          BD_ANALYTICS_CLIENT_CONFIG: ${{ secrets.BD_ANALYTICS_CLIENT_CONFIG }}
          BD_ANALYTICS_REFRESH_TOKEN: ${{ secrets.BD_ANALYTICS_REFRESH_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GH_READ_TOKEN: ${{ github.token }}
          RETENTION_MODE: ${{ (github.event_name == 'schedule' || inputs.save_report == true) && 'save' || 'test' }}
        run: python retansiyon_raporu.py
