name: Arena 5 Günlük Gözlem Serisi Planla ve Takip Et

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "schedule (5 videoyu YouTube Studio'da planla) | companion (sabah eksik kapak + akşam sabit yorum)"
        required: true
        type: string
        default: "schedule"
  schedule:
    - cron: "8 8 * * *"    # 11:08 TR — Pasifik kota sıfırlaması sonrası eksik kapak/plan varsa tamamla
    - cron: "32 16 * * *"  # 19:32 TR — 19:30 planlı yayını açıldıktan 2 dk sonra ilk yorum + Telegram kartı

permissions:
  contents: write

concurrency:
  group: arena-planla-5gun
  cancel-in-progress: false

jobs:
  planla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_ICERIK || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt openpyxl Pillow

      - name: Configure Google credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("client_secrets.json").write_text(os.environ["GOOGLE_CLIENT_SECRETS_JSON"], encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"], encoding="utf-8")
          PY

      - name: Run 5-day scheduler / companion
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'companion' }}"
          echo "Çalışma modu: $MODE"
          python planla_5gun.py "$MODE"

      - name: Commit & push updated schedule state
        run: |
          rm -f client_secrets.json token.json last_upload_payload.json last_upload_report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in scheduled_5day_plan.json gozlem_1hafta_baz.json slot_claims.txt uploaded.txt baslik.xlsx bilgidozu_yukleme_tablosu.xlsx panel_telemetry.json status_report.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(schedule): sync 5-day Arena YouTube scheduled cohort [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
