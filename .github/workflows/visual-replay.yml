name: Visual replay from approved run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Approved source run to replay (run #71 by default)"
        required: true
        default: "43937116973"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  visual_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=4 update -qq
          sudo apt-get -o Acquire::Retries=4 install -y -qq --fix-missing ffmpeg
          ffmpeg -version | head -1

      - name: Dependencies and render assets
        run: |
          pip install -q -r requirements-motor.txt openpyxl google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          python motor/varlik_hazirla.py

      - name: Download approved run archive
        uses: actions/download-artifact@v4
        with:
          name: uretim_71_arsiv
          path: input/archive
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download approved MP4
        uses: actions/download-artifact@v4
        with:
          name: motor-video
          path: input/video
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Local regression gates
        run: |
          python -m unittest discover -s tests -p 'test_pexels_gorsel_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_kapak_icerik.py' -v
          echo "MOTOR_VISUAL_QA_PASSED=1" >> "$GITHUB_ENV"

      - name: Live Pexels + Gemini replay (reuse approved narration and mix)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS_KEY || secrets.PEXELS_API }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python motor/replay_visuals.py \
            --archive input/archive \
            --old-video input/video/son/onay_bekleyen/final.mp4 \
            --out output/visual-replay \
            --source-run 71

      - name: Upload visual replay and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-replay-${{ github.run_number }}
          path: output/visual-replay/
          if-no-files-found: warn
          retention-days: 30
