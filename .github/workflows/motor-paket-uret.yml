name: Motor · Senaryo + Sabit Ses Paketi

on:
  workflow_dispatch:
    inputs:
      baslik:
        description: "Video başlığı / konusu"
        required: true
        type: string

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: XTTS-v2 ve motor bağımlılıkları
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -q six coqui-tts -r requirements.txt -r requirements-motor.txt
      - name: Merkez paketi hazırla ve Drive'a yükle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          MOTOR_VOICE_ID: klon_095_xtts
          MOTOR_XTTS_REFERENCE: ref_095.wav
          MOTOR_PAKET_DRIVE_ID: 1lKrhKOx9ywnhhA9xRkBGlhjxY8Ee9fg1
        run: |
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python motor/paket_uret.py --baslik "${{ inputs.baslik }}"
