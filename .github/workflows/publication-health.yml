name: Verified YouTube publication and Telegram card
on:
  schedule:
    - cron: '35,45,55 16 * * *'
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Read-only live health check and one clearly labelled Telegram test'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: yt-drive-uploader
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication-only dependencies
        run: pip install -q -r requirements-publication.txt
      - name: Publication safety tests (no network)
        run: python scripts/publication_tests.py
      - name: Configure live credentials
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for key,name in [('GOOGLE_CLIENT_SECRETS_JSON','client_secrets.json'),('GOOGLE_TOKEN_JSON','token.json')]:
              if not os.environ.get(key,'').strip(): raise SystemExit('Google authorization missing')
              Path(name).write_text(os.environ[key],encoding='utf8')
          PY
      - name: Verify live connections without inserting any video
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST_MESSAGE: ${{ inputs.test_message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publication_verify.py health
      - name: Confirm actual public video and deliver the green Telegram card once
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publication_verify.py deliver
      - name: Save non-secret diagnostic evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-publication-health
          path: publication_health_result.json
          if-no-files-found: ignore
          retention-days: 7
